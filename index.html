<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Devronics — ESP32, Arduino, Raspberry Pi &amp; Robotics Projects</title>
<style>
:root{
  --bg1:#e8efff;--bg2:#f3e8ff;--bg3:#e0fbff;--text:#14182b;--muted:#59607a;
  --glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.75);--gb:rgba(255,255,255,.8);
  --accent:#4f6bff;--accent2:#00b7d4;--orb1:#7c8cff;--orb2:#4de0ff;--orb3:#c58bff;
  --shadow:0 10px 40px rgba(60,80,160,.18);--code:rgba(20,24,43,.06);--field:rgba(255,255,255,.7);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg1:#080b1a;--bg2:#120a2a;--bg3:#04161f;--text:#eef1ff;--muted:#a3abc9;
  --glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.12);--gb:rgba(255,255,255,.16);
  --accent:#7d92ff;--accent2:#35d6f0;--orb1:#4a5bff;--orb2:#00b7d4;--orb3:#9b4dff;
  --shadow:0 10px 40px rgba(0,0,0,.45);--code:rgba(0,0,0,.35);--field:rgba(255,255,255,.08);}}
:root[data-theme="dark"]{
  --bg1:#080b1a;--bg2:#120a2a;--bg3:#04161f;--text:#eef1ff;--muted:#a3abc9;
  --glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.12);--gb:rgba(255,255,255,.16);
  --accent:#7d92ff;--accent2:#35d6f0;--orb1:#4a5bff;--orb2:#00b7d4;--orb3:#9b4dff;
  --shadow:0 10px 40px rgba(0,0,0,.45);--code:rgba(0,0,0,.35);--field:rgba(255,255,255,.08);}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));background-attachment:fixed;overflow-x:hidden;line-height:1.55}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.55;z-index:0;pointer-events:none}
.o1{width:420px;height:420px;background:var(--orb1);top:-120px;left:-100px}
.o2{width:380px;height:380px;background:var(--orb2);bottom:-120px;right:-80px}
.o3{width:300px;height:300px;background:var(--orb3);top:45%;left:55%}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:18px 18px 60px}
.glass{background:var(--glass);border:1px solid var(--gb);border-radius:22px;box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%)}
header.nav{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:28px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:10px;font-size:1.05rem}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-size:18px}
.nav nav{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nav a.l{color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:12px;font-size:.92rem}
.nav a.l:hover{background:var(--glass2);color:var(--text)}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:14px;padding:10px 18px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 20px rgba(79,107,255,.35);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:var(--glass2);color:var(--text);border:1px solid var(--gb);box-shadow:none}
.btn.red{background:linear-gradient(135deg,#ff5c7a,#ff8a5c)}
.icon{width:38px;height:38px;border-radius:12px;border:1px solid var(--gb);background:var(--glass2);color:var(--text)}
.hero{padding:48px 28px;text-align:center;margin-bottom:26px}
.pill{display:inline-block;padding:6px 14px;border-radius:99px;font-size:.8rem;background:var(--glass2);border:1px solid var(--gb);color:var(--muted)}
.hero h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.1;margin:16px 0 12px;letter-spacing:-1px}
.grad{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:620px;margin:0 auto 24px;color:var(--muted);font-size:1.05rem}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.stat{padding:12px 22px;border-radius:16px;background:var(--glass2);border:1px solid var(--gb);min-width:110px}
.stat b{display:block;font-size:1.5rem}.stat span{font-size:.8rem;color:var(--muted)}
h2.sec{font-size:1.6rem;margin:38px 4px 14px;letter-spacing:-.4px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--field);border:1px solid var(--gb);border-radius:13px;padding:11px 13px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,107,255,.2)}
select option{color:#111}
.search{flex:1;min-width:200px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--gb);background:var(--glass);color:var(--muted);padding:7px 14px;border-radius:99px;font-size:.85rem}
.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{padding:0;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-5px)}
.thumb{height:130px;display:grid;place-items:center;font-size:44px;position:relative;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.thumb .play{position:absolute;right:12px;bottom:10px;font-size:.75rem;background:rgba(0,0,0,.45);color:#fff;padding:4px 10px;border-radius:99px}
.cb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.cb h3{margin:0;font-size:1.12rem}.cb p{margin:0;color:var(--muted);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:.72rem;padding:3px 10px;border-radius:99px;background:var(--glass2);border:1px solid var(--gb);color:var(--muted)}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:1.2rem;margin-bottom:6px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.step{padding:22px;position:relative}
.num{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));margin-bottom:12px}
.step h4{margin:0 0 6px;font-size:1.05rem}.step p{margin:0;color:var(--muted);font-size:.92rem}
.note{padding:16px 20px;margin-top:16px;color:var(--muted);font-size:.92rem}
footer{text-align:center;color:var(--muted);font-size:.85rem;margin-top:44px}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-start;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 14px 20px;background:rgba(5,8,25,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);overflow:auto}
.modal.open{display:flex}
.sheet{width:100%;max-width:720px;padding:24px;background:var(--glass2);margin:auto}
.sheet h3{margin:0 0 14px;font-size:1.35rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}.nav nav{margin-left:0}}
label{display:block;font-size:.82rem;color:var(--muted);margin:12px 0 5px;font-weight:600}
textarea{min-height:90px;resize:vertical}
textarea.code{min-height:200px;font-family:ui-monospace,Consolas,Menlo,monospace;font-size:.82rem;white-space:pre;overflow:auto}
.acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:flex-end}
pre.cv{background:var(--code);border:1px solid var(--gb);border-radius:14px;padding:14px;overflow-x:auto;max-height:340px;font-size:.8rem;margin:8px 0 0;font-family:ui-monospace,Consolas,Menlo,monospace;color:var(--text)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);opacity:0;z-index:99;padding:12px 20px;border-radius:14px;background:var(--glass2);border:1px solid var(--gb);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.hide{display:none!important}
.thumb img{width:100%;height:100%;object-fit:cover}.vimg{width:100%;max-height:340px;object-fit:cover;border-radius:16px;margin-bottom:14px;border:1px solid var(--gb)}.prev{max-width:160px;max-height:110px;border-radius:12px;margin-top:8px;display:block}
</style>
